spring.application.name=ecom-proj

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopease}
spring.datasource.username=${DB_USERNAME:shopease}
spring.datasource.password=${DB_PASSWORD:shopease}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Pagination ---
spring.data.web.pageable.default-page-size=8
spring.data.web.pageable.max-page-size=50

# --- Security ---
# The default secret is for local development only. Always set JWT_SECRET in real deployments.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Admin account created on startup if it does not exist yet.
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.email=${ADMIN_EMAIL:admin@shopease.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# --- API docs ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

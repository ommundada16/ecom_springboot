# Tests run against H2 in PostgreSQL compatibility mode. The same Flyway migrations are applied,
# and Hibernate validates the entities against that schema.
spring.datasource.url=jdbc:h2:mem:shoptest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

app.jwt.secret=test-secret-test-secret-test-secret-test-secret
app.admin.email=admin@shopease.com
app.admin.password=Admin@12345
